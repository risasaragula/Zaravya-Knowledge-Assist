<!DOCTYPE html>
<html>
<head>
    <title>Zaravya Knowledge Assist</title>

    <link rel="stylesheet" href="/style.css">

</head>
<body>
    <div class="main-container">

        <div class="company-box">
            <h2>COMPANY</h2>
            <div class="company-buttons">
                <button onclick="openTemplate()">Template</button>
                <button onclick="document.getElementById('file').click()">Upload</button>
                <input type="file" id="file" accept=".pdf, .png, .jpg, .doc, .docx" onchange="uploadFile()">
            </div>
        </div>

        <div class="assist-box">
            <h1>Zaravya Assist</h1>
            <div class="question-area">
                <input id="question" placeholder="Type your question..." onkeydown="handleEnter(event)">
                <button class="ask-button" onclick="askQuestion()">ASK</button>
            </div>
            <div id="answer"></div>
        </div>
    </div>

    <script src="/script.js"></script>

</body>
</html>
