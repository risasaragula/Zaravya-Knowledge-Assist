<!DOCTYPE html>
    <html>
    <head>
        <title>Zaravya Knowledge Assist</title>
        <style>
            body {
                font-family: sans-serif;
                background: #f9f6f0;
                text-align: center;
                padding: 60px;
            }
            .box {
                background: white;
                width: 600px;
                margin: auto;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 3px 10px #ccc;
            }
            .top-buttons {
                text-align: left;
                margin-bottom: 30px;
            }
            .top-buttons button {
                padding: 10px 20px;
                margin-right: 5px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            input {
                width: 70%;
                padding: 12px;
                border: 1px solid #ccc;
                border-radius: 6px;
            }
            .ask-button {
                padding: 12px 20px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }
            #answer {
                margin-top: 25px;
                text-align: left;
                background: #f4f6f8;
                padding: 15px;
                border-radius: 6px;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <div class="top-buttons">
                <button onclick="openTemplate()">Template</button>
                <button onclick="document.getElementById('file').click()">Upload</button>
                <input type="file" id="file" accept=".pdf, .png, .jpg, .doc, .docx" style="display: none;" onchange="showfile()">
            </div>
            <h1>Zaravya Knowledge Assist</h1>
            <input id="question" placeholder="Type your question..." onkeydown="handleEnter(event)">
            <button class="ask-button" onclick="askQuestion()">ASK</button>
            <div id="answer"></div>
        </div>
        <script>
            async function askQuestion() {
                const question = document.getElementById("question").value.trim();
                const answer = document.getElementById("answer");
                if (!question) {
                    answer.innerText = "Please enter a question.";
                    return;
                }
                answer.innerText = "Thinking...";
                try {
                    const response = await fetch("/ask", {method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            question: question
                        })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error);
                    }
                    answer.innerText = data.answer;
                } catch (error) {
                    answer.innerText = "Error: " + error.message;
                }
            }
            function handleEnter(event) {
                if (event.key === "Enter") {
                    askQuestion();
                }
            }
            function openTemplate() {
                alert("Template feature will be added here soon.");
            }
            async function showfile() {
                const file = document.getElementById("file").files[0];
                if (!file) {
                    return;
                }
                const formData = new FormData();
                formData.append("file", file);
                try {
                    const response = await fetch("/upload", { method: "POST", body: formData});
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data.error);
                    }
                    alert(data.message + ": " + data.filename);
                } catch (error) {
                    alert("Upload error: " + error.message);
                }
            }
        </script>
    </body>
    </html>
