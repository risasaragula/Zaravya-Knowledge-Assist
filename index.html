<!DOCTYPE html>
<html>
<head>
    <title>Chatbot Assist</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="main-container">
        <div class="company-box">
            <h2>COMPANY</h2>
            <div class="company-buttons">
                <button onclick="openTemplate()">Template</button>
                <button onclick="document.getElementById('file').click()">Upload</button>
                <input type="file" id="file" accept=".pdf, .png, .jpg, .doc, .docx" onchange="uploadFile()">
            </div>
            <div class="company-question">
                <input id="company-question" placeholder="Ask about uploaded document..." onkeydown="handleCompanyEnter(event)">
                <button class="ask-button" onclick="askCompany()">ASK</button>
            </div>
            <div id="company-answer"></div>
        </div>

        <div class="assist-box">
            <h1>Zaravya Assist</h1>
            <div class="question-area">
                <input id="question" placeholder="Ask about Zaravya..." onkeydown="handleEnter(event)">
                <button class="ask-button" onclick="askQuestion()">ASK</button>
            </div>
            <div id="answer"></div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
